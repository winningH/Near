<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Near - AI 助手</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="14" r="2" fill="currentColor"/>
            <circle cx="20" cy="14" r="2" fill="currentColor"/>
            <path d="M11 20c1.5 2 6 2 7.5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">Near</span>
        </div>
        <button class="btn-icon sidebar-toggle" id="sidebarToggle" title="折叠侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <button class="btn-new-chat" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        新的对话
      </button>

      <div class="sidebar-section">
        <div class="section-title">对话历史</div>
        <div class="conversation-list" id="conversationList">
          <!-- 动态填充 -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">N</div>
          <span class="user-name">Near 用户</span>
        </div>
      </div>
    </aside>

    <!-- 折叠后的窄条 -->
    <div class="sidebar-collapsed" id="sidebarCollapsed">
      <button class="btn-icon sidebar-expand" id="sidebarExpand" title="展开侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <button class="btn-icon-collapsed" id="newChatCollapsed" title="新的对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
      <!-- 欢迎页 -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-container">
          <svg class="welcome-logo" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="24" cy="28" r="3.5" fill="currentColor"/>
            <circle cx="40" cy="28" r="3.5" fill="currentColor"/>
            <path d="M22 40c3 4 12 4 15 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <h1 class="welcome-title">你好，我是 Near</h1>
          <p class="welcome-subtitle">你的 AI 智能助手，随时为你解答问题、提供帮助</p>
          <div class="quick-actions">
            <button class="quick-action-btn" data-prompt="帮我写一段 Python 代码">
              <span class="qa-icon">💻</span>
              <span class="qa-text">写代码</span>
            </button>
            <button class="quick-action-btn" data-prompt="帮我翻译一段文字">
              <span class="qa-icon">🌍</span>
              <span class="qa-text">翻译</span>
            </button>
            <button class="quick-action-btn" data-prompt="帮我写一篇文章">
              <span class="qa-icon">✍️</span>
              <span class="qa-text">写文章</span>
            </button>
            <button class="quick-action-btn" data-prompt="帮我分析一个问题">
              <span class="qa-icon">💡</span>
              <span class="qa-text">分析问题</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 对话消息区 -->
      <div class="chat-messages" id="chatMessages" style="display: none;">
        <!-- 动态填充 -->
      </div>

      <!-- 输入区域 -->
      <div class="input-area">
        <div class="input-container">
          <!-- 附件预览（带左右滚动箭头） -->
          <div class="attachments-scroll-wrapper" id="attachmentsScrollWrapper">
            <button class="attachments-scroll-left" id="scrollLeftBtn" title="向左滚动">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
              </svg>
            </button>
            <div class="attachments-preview" id="attachmentsPreview" style="display: none;"></div>
            <button class="attachments-scroll-right" id="scrollRightBtn" title="向右滚动">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </button>
          </div>
          
          <div class="input-row">
            <!-- 消息输入框 -->
            <div class="input-wrapper">
              <textarea
                id="messageInput"
                placeholder="给 Near 发送消息..."
                rows="1"
              ></textarea>
            </div>

            <!-- 添加附件按钮 -->
            <button class="btn-attach" id="attachBtn" title="添加图片或文件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.json,.md" style="display: none;">

            <!-- 发送/中断按钮 -->
            <button class="btn-send" id="sendBtn" title="发送消息" disabled>
              <svg class="icon-send" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
              <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                <rect x="6" y="6" width="12" height="12" rx="2"/>
              </svg>
            </button>
          </div>

          <div class="input-footer">
            <!-- 深度思考切换（标签样式） -->
            <button class="btn-think" id="thinkBtn" title="深度思考模式">
              <span>深度思考</span>
            </button>
            <span class="input-hint">按 Enter 发送，Shift+Enter 换行</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu" style="display: none;">
    <button class="context-menu-item" data-action="rename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      重命名
    </button>
    <button class="context-menu-item danger" data-action="delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <polyline points="3,6 5,6 21,6"/>
        <path d="M19,6v14a2,2,0,0,1-2,2H7a2,2,0,0,1-2-2V6m3,0V4a2,2,0,0,1,2-2h4a2,2,0,0,1,2,2v2"/>
      </svg>
      删除对话
    </button>
  </div>

  <!-- 重命名弹窗 -->
  <div class="modal-overlay" id="renameModal" style="display: none;">
    <div class="modal">
      <h3 class="modal-title">重命名对话</h3>
      <input type="text" class="modal-input" id="renameInput" placeholder="输入新名称">
      <div class="modal-actions">
        <button class="btn-modal cancel" id="renameCancel">取消</button>
        <button class="btn-modal confirm" id="renameConfirm">确认</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
